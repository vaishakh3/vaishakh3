<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="300" viewBox="0 0 1100 300" role="img" aria-labelledby="title desc">
  <title id="title">Vaishakh's builder signal</title>
  <desc id="desc">A compact profile signal showing public repository count, primary languages, and current project themes.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07110d"/>
      <stop offset="0.55" stop-color="#0e2418"/>
      <stop offset="1" stop-color="#2a1712"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2de38c"/>
      <stop offset="0.58" stop-color="#f6c945"/>
      <stop offset="1" stop-color="#ff6b4a"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      .small { fill: #98b9a4; font: 700 13px ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: 0; }
      .title { fill: #f2fff7; font: 850 36px ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: 0; }
      .text { fill: #d7fbe8; font: 650 17px ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: 0; }
      .muted { fill: #9fbea9; font: 600 14px ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: 0; }
      .number { fill: #f8fff9; font: 900 42px ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: 0; }
      .dash { stroke-dasharray: 8 12; animation: dash 16s linear infinite; }
      .pulse { animation: pulse 2.8s ease-in-out infinite; }
      .float { animation: float 5s ease-in-out infinite; }
      @keyframes dash { to { stroke-dashoffset: -220; } }
      @keyframes pulse { 0%, 100% { opacity: .45; } 50% { opacity: 1; } }
      @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
      @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
    </style>
  </defs>

  <rect width="1100" height="300" rx="18" fill="url(#bg)"/>
  <rect x="18" y="18" width="1064" height="264" rx="14" fill="#07130e" opacity="0.74" stroke="#244634"/>
  <path d="M42 218 C178 156 260 251 397 185 C512 130 621 126 748 174 C860 216 938 173 1058 116" fill="none" stroke="url(#line)" stroke-width="2.5" opacity="0.74" class="dash"/>
  <path d="M42 238 C188 183 268 258 392 211 C520 163 641 154 761 202 C854 240 956 205 1058 150" fill="none" stroke="#4a7b5d" stroke-width="1" opacity="0.42"/>

  <g transform="translate(58 62)">
    <text class="small" x="0" y="0">PROFILE SIGNAL</text>
    <text class="title" x="0" y="48">Product systems, automation, and interface experiments.</text>
    <text class="text" x="0" y="86">JavaScript / TypeScript / Python, with a bias toward things people can actually use.</text>
  </g>

  <g transform="translate(60 174)">
    <g>
      <text class="number" x="0" y="0">65</text>
      <text class="muted" x="0" y="28">public repos</text>
    </g>
    <g transform="translate(146 0)">
      <text class="number" x="0" y="0">54</text>
      <text class="muted" x="0" y="28">original builds</text>
    </g>
    <g transform="translate(300 0)">
      <text class="number" x="0" y="0">32</text>
      <text class="muted" x="0" y="28">JS / TS repos</text>
    </g>
  </g>

  <g transform="translate(702 54)">
    <rect x="0" y="0" width="332" height="192" rx="14" fill="#091812" stroke="#34523f"/>
    <text class="small" x="26" y="36">LATEST FREQUENCIES</text>
    <g transform="translate(28 70)">
      <circle cx="0" cy="0" r="7" fill="#2de38c" class="pulse"/>
      <text class="text" x="22" y="6">Noiceboard</text>
      <text class="muted" x="150" y="6">profile surface</text>
    </g>
    <g transform="translate(28 110)">
      <circle cx="0" cy="0" r="7" fill="#f6c945" class="pulse"/>
      <text class="text" x="22" y="6">Selectra</text>
      <text class="muted" x="150" y="6">interview intelligence</text>
    </g>
    <g transform="translate(28 150)">
      <circle cx="0" cy="0" r="7" fill="#ff6b4a" class="pulse"/>
      <text class="text" x="22" y="6">DOM QA</text>
      <text class="muted" x="150" y="6">browser checks</text>
    </g>
  </g>

  <g transform="translate(628 222)" class="float" filter="url(#glow)">
    <circle cx="0" cy="0" r="20" fill="#0d2b1b" stroke="#2de38c" stroke-width="2"/>
    <circle cx="0" cy="0" r="6" fill="#f6c945"/>
  </g>
</svg>
