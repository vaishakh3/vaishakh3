<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="260" viewBox="0 0 1100 260" role="img" aria-labelledby="title desc">
  <title id="title">Vaishakh's builder signal</title>
  <desc id="desc">A simple profile signal showing core tools, project themes, and public repository stats.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07110d"/>
      <stop offset="0.62" stop-color="#102419"/>
      <stop offset="1" stop-color="#241612"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2de38c"/>
      <stop offset="0.55" stop-color="#f6c945"/>
      <stop offset="1" stop-color="#ff6b4a"/>
    </linearGradient>
    <style>
      .kicker { fill: #98b9a4; font: 800 13px ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: 0; }
      .title { fill: #f2fff7; font: 850 31px ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: 0; }
      .text { fill: #cfead7; font: 650 16px ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: 0; }
      .muted { fill: #9fbea9; font: 650 13px ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: 0; }
      .num { fill: #f8fff9; font: 900 34px ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: 0; }
      .chip { fill: #d7fbe8; font: 800 14px ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: 0; }
      .pulse { animation: pulse 3s ease-in-out infinite; }
      @keyframes pulse { 0%, 100% { opacity: .5; } 50% { opacity: 1; } }
      @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
    </style>
  </defs>

  <rect width="1100" height="260" rx="18" fill="url(#bg)"/>
  <rect x="18" y="18" width="1064" height="224" rx="14" fill="#07130e" opacity="0.78" stroke="#294a38"/>
  <rect x="42" y="206" width="1016" height="4" rx="2" fill="#173123"/>
  <rect x="42" y="206" width="520" height="4" rx="2" fill="url(#accent)" opacity=".86"/>

  <g transform="translate(54 58)">
    <text class="kicker" x="0" y="0">BUILDER SIGNAL</text>
    <text class="title" x="0" y="42">Useful tools with product edges.</text>
    <text class="text" x="0" y="76">JavaScript, TypeScript, Python, maps, AI workflows, and interface experiments.</text>
  </g>

  <g transform="translate(54 158)">
    <rect x="0" y="0" width="142" height="34" rx="17" fill="#0d2b1b" stroke="#2f6f4b"/>
    <text class="chip" x="18" y="22">Product apps</text>
    <rect x="154" y="0" width="142" height="34" rx="17" fill="#211d0f" stroke="#6d5c1e"/>
    <text class="chip" x="172" y="22">AI workflows</text>
    <rect x="308" y="0" width="128" height="34" rx="17" fill="#21150f" stroke="#74412f"/>
    <text class="chip" x="326" y="22">Automation</text>
    <rect x="448" y="0" width="138" height="34" rx="17" fill="#101b2a" stroke="#315478"/>
    <text class="chip" x="466" y="22">Visual search</text>
  </g>

  <g transform="translate(742 68)">
    <g>
      <text class="num" x="0" y="0">65</text>
      <text class="muted" x="0" y="25">public repos</text>
    </g>
    <g transform="translate(116 0)">
      <text class="num" x="0" y="0">54</text>
      <text class="muted" x="0" y="25">original builds</text>
    </g>
    <g transform="translate(232 0)">
      <text class="num" x="0" y="0">32</text>
      <text class="muted" x="0" y="25">JS / TS repos</text>
    </g>
  </g>

  <g transform="translate(694 168)">
    <circle cx="0" cy="0" r="7" fill="#2de38c" class="pulse"/>
    <text class="text" x="20" y="6">GasUndo</text>
    <circle cx="126" cy="0" r="7" fill="#f6c945" class="pulse"/>
    <text class="text" x="146" y="6">Aye Auto</text>
    <circle cx="264" cy="0" r="7" fill="#ff6b4a" class="pulse"/>
    <text class="text" x="284" y="6">Selectra</text>
  </g>
</svg>
